name: Validate

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # 30, not 20: with the house's tests (selftest's test:admin, the site build and its tests) a green
    # run takes 18-19 minutes (19m03s on #21, 18m36s on main at 3e12c24f), too close to 20.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # validate:governance reads the history; a shallow clone has none to judge.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            packages/admin/package-lock.json
            packages/org-os-federation-map/package-lock.json

      # `npm ci` only — the old `|| npm install` fallback meant a lockfile that
      # had drifted out of sync still produced a green run, which is the one
      # thing this step exists to catch.
      - name: Install dependencies
        run: npm ci

      # packages/admin is not an npm workspace, so the root install does not
      # reach it and its 44 tests would be skipped by the selftest step below.
      - name: Install admin package dependencies
        working-directory: packages/admin
        run: npm ci

      # The site's client bundle imports d3-force via
      # packages/org-os-federation-map; without this the site build below fails
      # to resolve it on a runner.
      - name: Install federation-map dependencies
        working-directory: packages/org-os-federation-map
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Validate structure
        run: npm run validate:structure

      # No `|| echo` soft-fail: the validator has shipped since v3.6, so a
      # failure here is a real failure and must not be swallowed.
      - name: Validate schemas
        run: npm run validate:schemas

      # Every data/*.yaml against the admin schemas (needs the admin deps above).
      # Errors fail the run; warnings are printed and do not.
      - name: Validate data
        run: npm run validate:data

      # The rules are well-formed and the history agrees with them (0.6 F2). CI=true makes
      # a commit that went around the loop an error; locally it is a warning.
      # The checkout above is full-depth so that it has history to read.
      - name: Validate governance
        run: npm run validate:governance

      - name: Analyze instances
        run: npm run analyze:instances

      - name: Tests
        run: npm test

      - name: Selftest (full reliability suite)
        run: npm run selftest

      # Explicit row as well as the selftest step: if selftest ever stops
      # covering it, the gate should break here rather than go quiet.
      - name: Admin package tests
        run: npm run test:admin

      # Includes verify-build.mjs, which enforces the base-prefix gate.
      - name: Build site
        working-directory: site
        run: npm run build

      - name: Site tests
        working-directory: site
        run: npm test

      - name: Check version triplet consistency
        run: npm run version:check
