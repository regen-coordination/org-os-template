# Federation Manifest v3.0
# org-os — Framework repo + multi-instance orchestration hub
# This file describes how org-os positions itself in the federation.

version: "3.0"
spec: "organizational-os/3.0"

# ── Identity ──────────────────────────────────────────────────────────────────
identity:
  name: "org-os"
  type: "Project"                 # framework + orchestration hub (solo-maintainer phase)
  emoji: "🧬"
  role: "framework-upstream + orchestration-hub"
  daoURI: ""                      # N/A (solo phase)
  chain: ""                       # N/A (solo phase)
  safe: ""                        # N/A (solo phase)
  hats: null                      # N/A (solo phase)
  gardens: ""                     # N/A (solo phase)
  onchain_registration:
    enabled: false
    chain: ""
    contract_address: ""

# ── Federation Network ─────────────────────────────────────────────────────────
network: "regen-coordination"
hub: "github.com/regen-coordination/org-os-template"  # this repo — framework-upstream

peers:
  - name: "organizational-os-framework"
    repo: "regen-coordination/organizational-os-framework"
    url: "https://github.com/regen-coordination/organizational-os-framework"
    trust: "full"
  - name: "organizational-os"
    repo: "regen-coordination/organizational-os"
    url: "https://github.com/regen-coordination/organizational-os"
    trust: "full"

upstream: []
# org-os IS the template. No upstream at framework layer.
# (Previous config pointed at luizfernandosg/organizational-os-template as a fork —
#  cleared on 2026-04-24 self-hosting inauguration since this repo is the canonical source.)

# ── Downstream Instances ───────────────────────────────────────────────────────
# Populated and maintained alongside data/instances.yaml.
# Run `npm run analyze:instances` to refresh drift status.
downstream:
  - name: "ReFi Barcelona"
    id: "refi-bcn-os"
    repo: "luizfernandosg/refi-bcn-os"
    url: "https://github.com/luizfernandosg/refi-bcn-os"
    type: "LocalNode"
    trust: "full"
    sync_direction: "framework→instance"
    local_path: "../refi-bcn-os"
    cloned: true

  - name: "ReFi DAO"
    id: "refi-dao-os"
    repo: "luizfernandosg/refi-dao-os"
    url: "https://github.com/luizfernandosg/refi-dao-os"
    type: "DAO"
    trust: "full"
    sync_direction: "framework→instance"
    local_path: "../refi-dao-os"
    cloned: true

  - name: "DAO OS"
    id: "dao-os"
    repo: "regen-coordination/dao-os"
    url: "https://github.com/regen-coordination/dao-os"
    type: "Project"
    trust: "full"
    sync_direction: "framework→instance"
    local_path: "../dao-os"
    cloned: true
    note: "DAO-module development platform, not an operational instance. Source of DAO-module skill promotion candidates."

  - name: "openclaw"
    id: "openclaw"
    repo: ""
    url: ""
    type: "AgentRuntime"
    trust: "full"
    sync_direction: "none"
    local_path: "../openclaw"
    cloned: true
    note: "Agent runtime, not a data instance."

  - name: "Regen Coordination"
    id: "regen-coordination-os"
    repo: "regen-coordination/regen-coordination-os"
    url: "https://github.com/regen-coordination/regen-coordination-os"
    type: "Hub"
    trust: "full"
    sync_direction: "framework→instance"
    local_path: "../regen-coordination-os"
    cloned: true
    note: "Synced to framework v3.0 on 2026-04-24 (full overlay incl. skills)."

  - name: "ReFi Mediterranean"
    id: "refi-med-os"
    repo: "ReFiDAO/refi-med-os"
    url: "https://github.com/ReFiDAO/refi-med-os"
    type: "LocalNode"
    trust: "full"
    sync_direction: "framework→instance"
    local_path: "../refi-med-os"
    cloned: true
    note: "Scaffolded 2026-04-28 from framework v3.0. Bootstrap pending — operator follows BOOTSTRAP.md + one-pager. Public website + knowledge base at repos/refi-mediterranean/ (ReFiDAO/ReFi-Mediterranean)."

# ── Agent Configuration ────────────────────────────────────────────────────────
agent:
  runtime: "claude-code"
  workspace: "."
  skills:
    - bootstrap-interviewer
    - capital-flow
    - expert-feynman
    - funding-scout
    - heartbeat-monitor
    - idea-scout
    - karpathy-guidelines
    - knowledge-curator
    - meeting-processor
    - org-os-init
    - schema-generator
    - superpowers-brainstorming
    - superpowers-executing-plans
    - superpowers-finishing-a-development-branch
    - superpowers-requesting-code-review
    - superpowers-subagent-driven-development
    - superpowers-systematic-debugging
    - superpowers-test-driven-development
    - superpowers-using-git-worktrees
    - superpowers-writing-plans
    - workspace-improver
  channels:
    - github
  proactive: false
  heartbeat_interval: "1h"

# ── Knowledge Commons ─────────────────────────────────────────────────────────
knowledge-commons:
  enabled: false
  shared-domains: []
  sync-protocol: "git"
  publish:
    meetings: false
    projects: false
    funding: false
  subscribe: []

# ── Cross-Repo Integrations ───────────────────────────────────────────────────
integrations:
  agent_runtimes:
    - name: "openclaw"
      repo: "organizational-os/openclaw-source"
      url: "https://github.com/organizational-os/openclaw-source"
      role: "primary-runtime"
    - name: "regen-eliza"
      repo: "regen-coordination/regen_eliza-refi_dao"
      url: "https://github.com/regen-coordination/regen_eliza-refi_dao"
      role: "alternative-runtime"
  knowledge_infrastructure:
    - name: "koi-net"
      repo: "organizational-os/koi-net"
      url: "https://github.com/organizational-os/koi-net"
      role: "real-time-sync"
    - name: "koi-net-integration"
      repo: "organizational-os/koi-net-integration"
      url: "https://github.com/organizational-os/koi-net-integration"
      role: "typescript-bridge"
  meeting_processing:
    - name: "OPAL"
      path: "integrations/opal/"
      role: "transcript-to-schema extraction"
      status: "production-ready; rollout pending (see opal-rollout workstream)"
  publishing:
    - name: "quartz-refi-template"
      repo: "organizational-os/quartz-refi-template"
      url: "https://github.com/organizational-os/quartz-refi-template"
      role: "documentation-site"
  grants:
    - name: "grants-os"
      repo: "luizfernandosg/grants-os"
      url: "https://github.com/luizfernandosg/grants-os"
      role: "grants-platform"

# ── Operational Packages (framework bundles) ─────────────────────────────────
# Actual packages/ directory contains 11 entries; toggles below reflect framework
# default for downstream template consumers.
packages:
  knowledge_base: true
  meetings: false
  projects: false
  finances: false
  coordination: false
  webapps: false
  web3: false
  egregore: false

# ── Customizations ────────────────────────────────────────────────────────────
customizations:
  - path: "SOUL.md"
    reason: "Framework identity"
    type: "addition"
    maintain_on_sync: true
  - path: "IDENTITY.md"
    reason: "Framework identity + orchestration role"
    type: "addition"
    maintain_on_sync: true
  - path: "data/"
    reason: "Operational data + framework-only registries (instances, skills-matrix, packages-matrix)"
    type: "addition"
    maintain_on_sync: true
  - path: "memory/"
    reason: "Session memory + drift reports"
    type: "addition"
    maintain_on_sync: true
  - path: "skills/"
    reason: "Framework canonical skills"
    type: "addition"
    maintain_on_sync: true

# ── Governance ────────────────────────────────────────────────────────────────
governance:
  maintainers:
    - name: "Luiz Fernando"
      handle: "github:luizfernandosg"
      role: "sole-maintainer"
  decision_model: "solo-maintainer"  # evolves to consensus/voting at OSS phase
  proposal_threshold: "maintainer decision"

# ── Platforms ─────────────────────────────────────────────────────────────────
platforms:
  primary: "github"
  deployment: "github-pages"
  domain: ""
  mirrors: []

# ── Metadata ─────────────────────────────────────────────────────────────────
metadata:
  created: "2026-04-05"
  last_updated: "2026-04-24"
  framework_version: "3.0"
  self_hosting_since: "2026-04-24"
