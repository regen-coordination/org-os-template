# promotion_status:
#   canonical        — shipped in framework AND adopted by ≥1 instance
#   evaluating       — shipped in framework but no instance adoption yet (awaiting signal)
#   candidate        — present in ≥2 instances, not yet in framework (promotion-ready)
#   instance-specific — kept local to a specific instance, not generalizable
