schema_version: "2.0"

# Packages Matrix — FRAMEWORK-ONLY REGISTRY
# Cross-instance catalog of every package across the federation.
# Surfaces divergence and promotion candidates.
#
# lifecycle_status (v3.5+):
#   active   — currently used by ≥1 instance; maintained
#   dormant  — in framework but no instances currently using; kept as scaffolding
#   planned  — approved for inclusion; not yet built
#   retired  — no longer maintained; existing consumers should migrate

packages:
  # --- Framework packages (in org-os/packages/) ---
  - id: "agents-app"
    owner: "framework"
    instances_using: []
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "dormant"
    notes: "Agent control app. Bundled at framework; instances consume via federation.yaml toggles."

  - id: "egregore-core"
    owner: "framework"
    instances_using: []
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "dormant"
    notes: "Collective intelligence core. Referenced by refi-bcn federation.yaml peers."

  - id: "toolkit-framework"
    owner: "framework"
    instances_using: ["regen-toolkit", "refi-dao-os"]
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "active"
    notes: "@regen-commons/toolkit-framework — portable, org-os-agnostic knowledge commons framework (semantic kernel, 22 schemas, the machine, 7 skills, 3 adapters). Develops in regen-toolkit; promoted here 2026-07-05. Consumed via org-os-kms. 100/100 tests."

  - id: "org-os-kms"
    owner: "framework"
    instances_using: ["regen-toolkit"]
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "active"
    notes: "@org-os/kms — binds toolkit-framework into org-os (module src/bind.mjs + profile). Executable lifecycle, registry bridge, CLI, render, federation. Installed + activated in regen-toolkit 2026-07-05; refi-dao-os adopting. Depends on toolkit-framework. 44/44 tests. + map builder/frontier/vault-artifact (federation map, 2026-07)"

  - id: "org-os-federation-map"
    owner: "framework"
    instances_using: ["org-os"]
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "active"
    notes: "@org-os/federation-map — 'the torch'. View-plane web component for the federation/provenance map (d3-force only dep). Data plane is org-os-kms `render map`. Spec: docs/superpowers/specs/2026-07-19-federation-map-design.md."

  - id: "koi-bridge"
    owner: "framework"
    instances_using: []
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "dormant"
    notes: "KOI-net integration bridge."

  - id: "koi-opal-bridge"
    owner: "framework"
    instances_using: []
