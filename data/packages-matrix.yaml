    promotion_status: "canonical"
    lifecycle_status: "dormant"
    notes: "KOI-net ↔ OPAL bridge."

  - id: "opal-bridge"
    owner: "framework"
    instances_using: []
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "planned"
    notes: "OPAL meeting/transcript processing bridge. Rollout planned (opal-rollout workstream)."

  - id: "operations"
    owner: "framework"
    instances_using: ["refi-bcn-os", "refi-dao-os"]
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "active"
    notes: "Operational layer. Active in both production instances."

  - id: "paperclip-agents-app"
    owner: "framework"
    instances_using: ["regen-coordination-os"]
    in_framework: true
    promotion_status: "canonical"
    lifecycle_status: "dormant"
