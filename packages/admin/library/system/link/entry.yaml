id: system:link
shelf: system
title: Link
summary: Any outside page the org uses, framed in the platform with a way to open it. Nothing is read from it.
version: 1.0.0
source: framework
standing: stated
as_of: 2026-10-18
tags:
  function: [coordination]
  domain: [operations]
  audience: [member]
  maturity: field-informed
config:
  properties:
    id: { type: string, default: link, description: The id the org will call it by. }
    name: { type: string, description: What it is called here. }
    url: { type: string, description: The address of the page. }
  required: [id, name, url]
installs:
  - op: create
    record: "systems:${config.id}"
    value:
      id: "${config.id}"
      name: "${config.name}"
      url: "${config.url}"
      kind: link
      driver: link
