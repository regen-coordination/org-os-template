id: system:test-link
shelf: system
title: Test link
summary: Any outside page, framed with a way to open it. Nothing is read from it.
version: 1.0.0
source: test-shelf
standing: stated
as_of: 2026-10-29
tags:
  maturity: field-informed
config:
  properties:
    id: { type: string, default: test-link, description: The id the org will call it by. }
    name: { type: string, description: What it is called here. }
    url: { type: string, description: The address of the page. }
  required: [id, name, url]
installs:
  - op: create
    record: "systems:${config.id}"
    value: { id: "${config.id}", kind: link, driver: link, name: "${config.name}", url: "${config.url}" }
