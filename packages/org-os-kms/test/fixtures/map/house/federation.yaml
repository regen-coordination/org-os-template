identity:
  name: "Riverbend Commons"
  type: "Hub"
upstream:
  - name: "Watershed Network"
    id: "watershed-network"
    repo: "example/watershed-network"
    type: "Network"
    trust: "full"
peers:
  - name: "Hillside Coop"
    id: "hillside-coop"
    repo: "example/hillside-coop"
    type: "Coop"
    trust: "full"
    local_path: "siblings/hillside"
  - name: "Lowland Guild"
    id: "lowland-guild"
    type: "Guild"
    trust: "observer"
downstream:
  - name: "Youth Circle"
    id: "youth-circle"
    repo: "example/youth-circle"
    type: "LocalNode"
    trust: "full"
    local_path: "siblings/youth"
  - name: "Market Garden"
    id: "market-garden"
    repo: "example/market-garden"
    type: "LocalNode"
    trust: "observer"
