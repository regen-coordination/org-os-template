# Circles group the crew's roles. Vocabulary and charter: roles/README.md.
# max_agents caps how many crew agents may be seated at once. The five shipped roles (the
# lead among them) take five seats; the sixth allows a second agent in one role, for
# example a reviewer while an engineer is still seated. Each seated agent is a full model
# session on your own plan: lower this number if your plan is small. A file with no
# max_agents line falls back to 4 in scripts/crew/roles.mjs.
max_agents: 6
circles:
  - id: lead
    name: Coordination
    purpose: Carries goals from the operator to the circles and the circles' requests back.
  - id: strategy
    name: Strategy
    purpose: Direction and political economy; gathers needs from the instances.
  - id: research
    name: Research
    purpose: Answers questions from primary sources and turns findings into proposals.
  - id: engineering
    name: Engineering
    purpose: Builds, verifies and reviews the framework's code.
  - id: commons
    name: Commons
    purpose: Documentation, education and the consistency of the shared record.
