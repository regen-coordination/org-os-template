# templates/strings.yaml — the short strings clone-framework writes into a new
# instance, outside the templates and scaffold files. English is the base; a
# language overrides any key in templates/<lang>/strings.yaml, and a key it does
# not carry falls back to the one here. Values are rendered like templates.

