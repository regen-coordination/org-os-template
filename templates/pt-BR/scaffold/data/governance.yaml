# registro legível por máquina (propostas EIP-4824) são espelhadas aqui.
# Os valores abaixo ficam em inglês: são lidos pelas ferramentas.

governance:
  model: "solo-maintainer"     # solo-maintainer (uma pessoa mantém) | steward-council (conselho) | multisig | assembly (assembleia) | conviction
  current_phase: "bootstrap"   # bootstrap (início) | transition (transição) | active (em funcionamento) | sunset (encerramento)
  infrastructure:
    safe: null
    hats_tree: null
    gardens: null
    snapshot: null
  decisions: []
  elections: []
